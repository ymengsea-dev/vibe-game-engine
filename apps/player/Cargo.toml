[package]
name = "player"
description = "Standalone RustyEngine runtime: loads an exported scene + asset bundle and runs it, with no editor or AI crates linked."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "player"
path = "src/main.rs"

[dependencies]
# Declared directly (not inherited) so `default-features = false` is
# allowed — that drops the `studio` feature, keeping the editor out of a
# shipped runtime (NFR-004). Navigation (`engine_ai`) is unconditional:
# it is gameplay, and a shipped game needs to pathfind.
engine = { path = "../../crates/engine", default-features = false }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true
