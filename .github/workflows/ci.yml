# Builds and tests Studio and the game player on macOS, Windows and Linux,
# then stages a portable Studio package per system as a download.
#
# This proves the code builds and its tests pass on each system. It does not
# replace starting Studio and an exported game on a clean machine.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Line tables only keeps the build folder small enough for the runners.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libasound2-dev libudev-dev libxdo-dev \
            libxkbcommon-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Reported, not blocking: parts of the tree are not formatted yet.
      - name: Format
        if: runner.os == 'Linux'
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --workspace --all-features

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Snapshot tests that need a GPU are marked #[ignore] and skipped here.
      - name: Test
        run: cargo test --workspace --all-features

  package:
    name: Package (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libasound2-dev libudev-dev libxdo-dev \
            libxkbcommon-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The packager refuses programs that hold the home folder's path.
      - name: Build Studio and the player
        shell: bash
        run: |
          RUSTFLAGS="--remap-path-prefix=$HOME=/build" cargo build -p editor -p player --release

      - name: Stage the Studio package
        shell: bash
        run: cargo run -p studio_packager -- target/release target/studio-package

      - uses: actions/upload-artifact@v4
        with:
          name: rustyengine-studio-${{ runner.os }}
          path: target/studio-package
          if-no-files-found: error
