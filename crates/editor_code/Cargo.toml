[package]
name = "editor_code"
description = "Integrated code editor for RustyEngine Studio: a Monaco instance in a wry webview, pinned over the Code panel."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
wry = { workspace = true, features = ["devtools"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Clear the autoresizing mask wry puts on the child webview so our
# per-frame `set_bounds` is authoritative. Versions match wry 0.52's.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView", "NSResponder"] }

[lints]
workspace = true
