[package]
name = "engine_editor"
description = "Visual editor built on egui: hierarchy, inspector, asset browser, scene view, console, and profiler."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
bevy_ecs.workspace = true
egui.workspace = true
egui-winit.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
glam.workspace = true
thiserror.workspace = true
engine_asset.workspace = true
engine_ecs.workspace = true
engine_editor_derive.workspace = true
engine_platform.workspace = true
engine_project.workspace = true
engine_renderer.workspace = true
engine_scene.workspace = true
engine_utils.workspace = true
serde.workspace = true
ron.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Integrated terminal — editor-only, off by default so runtime builds
# (game -> engine -> engine_editor) don't pull a PTY stack (NFR-004).
portable-pty = { workspace = true, optional = true }
alacritty_terminal = { workspace = true, optional = true }

[dev-dependencies]
# Encode a real PNG for the asset-import tests; test-only, never linked
# into the editor or a shipped game.
image.workspace = true

[features]
terminal = ["dep:portable-pty", "dep:alacritty_terminal"]

[lints]
workspace = true
