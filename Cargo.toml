[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "game", "editor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Meng Sea <mrmengsea@gmail.com>"]
repository = ""

# ---------------------------------------------------------------------------
# Internal crates
# ---------------------------------------------------------------------------
[workspace.dependencies]
engine = { path = "crates/engine", version = "0.1.0" }
engine_core = { path = "crates/engine_core", version = "0.1.0" }
engine_platform = { path = "crates/engine_platform", version = "0.1.0" }
engine_renderer = { path = "crates/engine_renderer", version = "0.1.0" }
engine_ecs = { path = "crates/engine_ecs", version = "0.1.0" }
engine_scene = { path = "crates/engine_scene", version = "0.1.0" }
engine_asset = { path = "crates/engine_asset", version = "0.1.0" }
engine_physics = { path = "crates/engine_physics", version = "0.1.0" }
engine_animation = { path = "crates/engine_animation", version = "0.1.0" }
engine_audio = { path = "crates/engine_audio", version = "0.1.0" }
engine_ui = { path = "crates/engine_ui", version = "0.1.0" }
engine_editor = { path = "crates/engine_editor", version = "0.1.0" }
engine_editor_derive = { path = "crates/engine_editor_derive", version = "0.1.0" }
engine_project = { path = "crates/engine_project", version = "0.1.0" }
editor_code = { path = "crates/editor_code", version = "0.1.0" }
editor_lsp = { path = "crates/editor_lsp", version = "0.1.0" }
engine_scripting = { path = "crates/engine_scripting", version = "0.1.0" }
engine_network = { path = "crates/engine_network", version = "0.1.0" }
engine_ai = { path = "crates/engine_ai", version = "0.1.0" }
engine_utils = { path = "crates/engine_utils", version = "0.1.0" }

# ---------------------------------------------------------------------------
# External dependencies (technology stack — see docs/ARCHITECTURE.md).
# Declared here for single-point version management; each is wired into a
# crate only when a milestone needs it, and its version is verified against
# the latest release at that point.
# ---------------------------------------------------------------------------
# Platform / rendering
winit = "0.30"
wgpu = "30"
# ECS / math
bevy_ecs = "0.19"
glam = "0.33"
# GPU-safe byte casting for uniform/vertex buffer uploads
bytemuck = { version = "1", features = ["derive"] }
# Physics
rapier2d = "0.35"
rapier3d = "0.35"
# Audio
kira = "0.12"
# Editor UI
egui = "0.36"
egui-winit = "0.36"
egui-wgpu = "0.36"
# Font-file validation before handing bytes to egui (same parser epaint uses).
ab_glyph = "0.2.32"
# Integrated terminal (editor-only, feature-gated): PTY process + VT model.
portable-pty = "0.9"
alacritty_terminal = "0.26"
# rust-analyzer LSP bridge (editor-only): protocol types.
lsp-types = "0.97"
# Proc-macro tooling (for engine_editor_derive)
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.12"
# Assets
gltf = "1"
image = "0.25"
# Concurrency / async
rayon = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
# One-shot blocking on wgpu's async init calls (adapter/device request) at
# startup; tokio is reserved for background tasks (asset loading, network).
pollster = "1"
# Diagnostics
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
# Tooling
notify = "8"
uuid = { version = "1", features = ["v4", "serde"] }
# Integrated code editor: Monaco in a native webview (editor_code crate only).
wry = "0.52"

# ---------------------------------------------------------------------------
# Lints — enforce docs/ENGINEERING.md at compile time.
# Tests are exempted from unwrap/expect/panic via clippy.toml.
# ---------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"

[profile.dev]
opt-level = 1

# Fast iteration: fully optimize dependencies even in dev builds so wgpu,
# physics, and asset decoding stay usable while the engine itself compiles
# quickly.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
